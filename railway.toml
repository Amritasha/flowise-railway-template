[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/ping"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Note: volumes and variables are NOT declared here.
#
# Railway's config-as-code does not create volumes -- a [[deploy.volumeMounts]]
# block here is silently ignored, which is how this template ended up with no
# persistence at all while appearing to have some. The volume and the storage
# paths live in the Railway template definition instead, where they actually
# take effect.
